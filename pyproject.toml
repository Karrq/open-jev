[project]
name = "openjev"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "huggingface-hub>=1.31.0",
    "mlx>=0.24",
    "mlx-lm>=0.24",
    "numpy>=2.5.3",
    "safetensors>=0.8.0",
    "transformers>=5.17.0",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
torch = ["torch>=2.14.0", "accelerate>=1.0"]   # only for jevlike comparison and HF cross-checks
doom = ["vizdoom>=1.2.4"]                         # demo/doom: play Doom in the terminal with the server choosing actions

[project.scripts]
openjev = "openjev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openjev"]

[dependency-groups]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
